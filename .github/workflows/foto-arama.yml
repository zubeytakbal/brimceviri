# Geçici iş: yalnızca foto-arama dalına gönderimde çalışır, siteyi yayınlamaz. Aday listesini aynı dala commit eder.
name: Foto arama

on:
  push:
    branches: [foto-arama]

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # adaylar.json yoksa arar; varsa karşılaştırma sayfalarını ya da (secim.json varsa) seçilen WebP'leri hazırlar.
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ ! -f tools/foto-arama/adaylar.json ]; then python3 tools/foto-arama/ara.py && mv adaylar.json tools/foto-arama/adaylar.json; fi
          pip install --quiet pillow
          python3 tools/foto-arama/hazirla.py
      # Kalan değişiklikler (ör. secilenler.json) dala yazılır.
      - run: |
          git add tools/foto-arama
          git diff --cached --quiet || (git commit -q -m "Foto arama sonucu" && git pull -q --rebase && git push -q)
