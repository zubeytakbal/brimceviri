# Site tamamen statik (output: "export") olarak derlenir ve Cloudflare Pages'e
# yuklenir. Gunluk calisma; doviz, altin ve akaryakit fiyatlari ile tarihe
# bagli sayfalari (takvim, geri sayim, yillik uyarilar) tazeler.
#
# Gerekli depo sirlari (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   "Cloudflare Pages: Edit" izinli API token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimligi
name: Deploy

on:
  push:
    # main canli siteye, claude/* dallari <dal>.birimceviri.pages.dev onizlemesine yuklenir.
    branches: [main, "claude/**"]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Google Fonts indirmesi ara sıra düşüyor (next/font); yalnızca o hatada bir kez daha dener.
      - name: Build
        run: |
          npm run build 2>&1 | tee build.log && exit 0
          grep -q "An error occurred in \`next/font\`" build.log || exit 1
          echo "next/font indirme hatası, yeniden deneniyor"
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Create Cloudflare Pages project (first run only)
        run: npx --yes wrangler@3 pages project create birimceviri --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=birimceviri --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Yearly update reminders
        if: github.event_name == 'schedule'
        run: npx tsx scripts/annual-reminders.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
