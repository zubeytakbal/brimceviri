<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Bilim araçları önizleme kontrolü</title><style>body{font:16px system-ui;background:#eef1f6;margin:16px}header{margin-bottom:16px}label{margin-right:20px}iframe{border:1px solid #aaa;background:white;display:block}</style></head><body><header><label>Sayfa <select id="route"><option value="/">Ana sayfa</option><option value="/bilim-hesaplayicilari">Bilim merkezi</option><option value="/bilim-hesaplayicilari/matematik">Matematik</option><option value="/bilim-hesaplayicilari/matematik/kesir-hesaplama">Kesir</option><option value="/bilim-hesaplayicilari/matematik/ortalama-hesaplama">İstatistik</option><option value="/bilim-hesaplayicilari/kimya/entalpi-hesaplama">Entalpi</option><option value="/bilim-hesaplayicilari/matematik/1-bilinmeyenli-denklem-cozme">Denklem</option></select></label><label>Genişlik <select id="width"><option value="390">Mobil 390 px</option><option value="1280">Masaüstü 1280 px</option></select></label><span>Yalnızca önizleme kontrol sayfası.</span></header><iframe title="Araç önizlemesi" id="preview" width="390" height="844" src="/"></iframe><script>const frame=document.getElementById('preview');document.getElementById('route').addEventListener('change',e=>frame.src=e.target.value);document.getElementById('width').addEventListener('change',e=>frame.width=e.target.value);</script></body></html>
