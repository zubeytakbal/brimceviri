# Geçici iş: yalnızca foto-arama dalına gönderimde çalışır, siteyi yayınlamaz. Aday listesini aynı dala commit eder.
name: Foto arama

on:
  push:
    branches: [foto-arama]

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/foto-arama/ara.py
      # Sonuç aynı dala commit edilir (GITHUB_TOKEN ile yapılan gönderim bu işi yeniden başlatmaz).
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mv adaylar.json tools/foto-arama/adaylar.json
          git add tools/foto-arama/adaylar.json
          git commit -m "Foto arama sonucu"
          git push
